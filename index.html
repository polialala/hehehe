<!DOCTYPE html>
<html lang="ru">
<head>
    <meta property="og:title" content="hehehe">
    <meta property="og:description" content="Please login to continue.">
    <meta property="og:image" content="https://github.com/polialala/valentine/blob/main/image.jpg?raw=true">
    <meta name="theme-color" content="#00ff88">
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hehehe</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #00ff88;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    #matrix {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.15;
    }

    /* Эффект мерцания старого экрана */
    .scanline {
        width: 100%;
        height: 2px;
        background: rgba(0, 255, 136, 0.05);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        pointer-events: none;
        animation: scanline 6s linear infinite;
    }

    @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

    #terminal-container {
        position: relative;
        z-index: 1;
        width: 95vw;
        height: 85vh;
        background: rgba(0, 15, 0, 0.9);
        border: 1px solid #00ff88;
        box-shadow: inset 0 0 20px rgba(0, 255, 136, 0.1), 0 0 10px rgba(0, 255, 136, 0.2);
        padding: 15px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        border-radius: 5px;
    }

    /* Экран загрузки */
    #boot-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: black;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: left;
        white-space: pre;
        font-size: 13px;
    }

    /* Основной терминал */
    #terminal {
        flex-grow: 1;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
        line-height: 1.3;
        scrollbar-width: none; /* Firefox */
    }
    #terminal::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    #input-line {
        display: none; /* Скрыт пока идет загрузка */
        align-items: center;
        border-top: 1px solid rgba(0, 255, 136, 0.2);
        padding-top: 10px;
        margin-top: 5px;
    }

    #prompt { color: #00ff88; margin-right: 8px; font-weight: bold; }

    input {
        background: transparent;
        border: none;
        color: #00ff88;
        font-family: inherit;
        font-size: 16px;
        flex-grow: 1;
        outline: none;
    }

    #terminal div {
        margin-bottom: 4px;
        padding-left: 5px;
    }

    /* Стиль для разделителей */
    .separator {
        color: rgba(0, 255, 136, 0.3);
        margin: 8px 0;
        user-select: none;
    }

    /* Красный цвет для ASCII сердца */
    .heart-ascii {
        color: #ff3333;
        line-height: 1.1;
        text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
    }

    .virus-text {
    position: fixed;
    z-index: 100;
    font-weight: bold;
    pointer-events: none;
    white-space: nowrap;
    animation: pulse 0.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; color: #ff0000; }
    100% { transform: scale(1); opacity: 1; }
}

    .highlight { color: #ff3333; font-weight: bold; }
    .cmd-history { color: #555; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="scanline"></div>

<div id="terminal-container">
    <div id="boot-screen">
        <div id="boot-text"></div>
    </div>

    <div id="terminal"></div>
    
    <div id="input-line">
        <span id="prompt">admin@heart:~$</span>
        <input type="text" id="commandInput" autocomplete="off" />
    </div>
</div>

<script>
// ====== MATRIX EFFECT ======
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);
function drawMatrix() {
    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random()*letters.length));
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 50);


// ====== LOGIC ======
const bootScreen = document.getElementById("boot-screen");
const bootText = document.getElementById("boot-text");
const terminal = document.getElementById("terminal");
const inputLine = document.getElementById("input-line");
const commandInput = document.getElementById("commandInput");
const promptSpan = document.getElementById("prompt");

const credentials = { login: "admin", password: "admin" };
let stage = "login"; // Этапы: login -> password -> shell

const bootContent = `
CURRENT
CPU    <<< <span class="highlight">100%</span> >>>
MEM    <<< <span class="highlight">99%</span> >>>
LOVE   <<< <span class="highlight">MAX</span> >>>

ELAPSED
TIME   <<< 0:14 <span class="highlight">❤️</span> >>>

RESOURCES
HEART  <<< ██████████████
HUGS   <<< ████████████
KISSES <<< ███████████

[ SYSTEM READY ]
`;

window.onload = () => {
    bootText.innerHTML = "Initializing heart-server...";
    setTimeout(() => {
        bootText.innerHTML = bootContent;
        setTimeout(() => {
            bootScreen.style.opacity = "0"; // Плавное исчезновение загрузки
            setTimeout(() => {
                bootScreen.style.display = "none";
                inputLine.style.display = "flex";
                promptSpan.innerText = "login:"; // Начинаем с логина
                commandInput.focus();
            }, 500);
        }, 3000);
    }, 1000);
};

function formatText(text) {
    // Если в тексте есть характерные точки ASCII-арта
    if (text.includes(':::')) {
        return `<div class="heart-ascii">${text}</div>`;
    }

    return text
        .toString()
        .replace(/❤️/g, '<span class="highlight">❤️</span>')
        .replace(/LOVE/g, '<span class="highlight">LOVE</span>')
        .replace(/100%/g, '<span class="highlight">100%</span>')
        .replace(/MAX/g, '<span class="highlight">MAX</span>')
        .replace(/\(running\)/g, '<span style="color: #00ff00">(running)</span>')
        // Добавляем поддержку переносов строк, если это не HTML
        .replace(/\n/g, '<br>');
}

function print(text, isCommand = false) {
    const messageElement = document.createElement('div');
    
    if (isCommand) {
        // Добавляем визуальный разделитель перед командой
        const sep = document.createElement('div');
        sep.className = 'separator';
        sep.innerText = '----------------------------------------';
        terminal.appendChild(sep);
        
        messageElement.className = 'cmd-history';
        messageElement.innerHTML = `> ${text}`;
    } else {
        messageElement.innerHTML = formatText(text);
    }
    
    terminal.appendChild(messageElement);
    
    // Плавный скролл вниз
    terminal.scrollTop = terminal.scrollHeight;
}

const heartAscii = `
   .:::.   .:::.
  :::::::.:::::::
  :::::::::::::::
   ':::::::::::'
     ':::::::'
       ':::'
        ':'`;

const commands = {
    help: `[ SYSTEM HELP ]
------------------------------------
status           - check system vitals
docker ps        - list active feelings
systemctl status - service health
i_love_you       - ???
whoami           - user info
reboot           - shutdown system`,

    status: `PROFILE INFORMATION
------------------------------------
CPU LOAD     : 100% thinking about you
MEMORY       : 99% occupied by you
UPTIME       : since the day we met
STATUS       : INFATUATED`,

    "docker ps": `CONTAINER ID   NAME           STATUS
------------------------------------------------
01ab23cd45     butterflies    Up since we met
99ef88aa77     happiness      Running
77aa66bb55     future         Starting...

${heartAscii}`,

    "systemctl status": `● love.service - Infinite Love Service
   Loaded: loaded (/etc/systemd/system/love.service)
   Active: active (running)
   Since: the day we met ❤️
   Tasks: 1 (limit: infinity)`,

    whoami: `USER INFORMATION
------------------------------------
Name: My favorite human
Access Level: Administrator of my heart ❤️`,

    i_love_you: `[ ACCESSING HIDDEN FILES ]
------------------------------------
❤ (ɔˆз(ˆ⌣ˆc)`
};

commandInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const value = commandInput.value.trim();
        const cmd = value.toLowerCase();

        if (stage === "login") {
            print("login: " + value, true);
            if (cmd === credentials.login) {
                stage = "password";
                promptSpan.innerText = "password:";
                commandInput.type = "password";
            } else {
                print("Invalid login. Try 'admin'.");
            }
        } 
        else if (stage === "password") {
            // Не выводим пароль в историю для реализма
            print("password: *****", true);
            if (value === credentials.password) {
                print("Access granted. Welcome, Admin ❤️");
                stage = "shell";
                promptSpan.innerText = "admin@heart:~$";
                commandInput.type = "text";
                commandInput.placeholder = "";
            } else {
                print("Access denied. Try 'admin'.");
            }
        } 
        else if (stage === "shell") {
            if (value !== "") {
                print(promptSpan.innerText + " " + value, true);
                
                if (cmd === "reboot") {
                    runRebootVirus(); // Вызываем функцию с вирусом
                } else if (commands[cmd]) {
                    print(commands[cmd]);
                } else {
                    print("Command not found: " + cmd + ". Type 'help' for list.");
                }
            }
        }
        commandInput.value = "";
    }
});

// Функция для вируса при reboot
function runRebootVirus() {
    print("CRITICAL ERROR: Heart overflow detected!");
    const phrases = ["I LOVE YOU", "i <3 u", "SYSTEM OVERLOAD", "ERROR: LOVE", "01001100 01001111 01010110 01000101"];
    
    const interval = setInterval(() => {
        const div = document.createElement('div');
        div.className = 'virus-text';
        div.innerHTML = phrases[Math.floor(Math.random() * phrases.length)];
        div.style.left = Math.random() * 90 + "vw";
        div.style.top = Math.random() * 90 + "vh";
        div.style.color = Math.random() > 0.5 ? "#ff3333" : "#00ff88";
        document.body.appendChild(div);
    }, 30);

    setTimeout(() => {
        clearInterval(interval);
        // Полная очистка страницы
        document.body.innerHTML = '';
        document.body.style.backgroundColor = "black";

        // Создаем финальный экран "смерти"
        const finalScreen = document.createElement('div');
        finalScreen.style.cssText = `
            color: #ff3333;
            text-align: center;
            margin-top: 45vh;
            font-family: monospace;
            font-size: 18px;
            text-shadow: 0 0 10px red;
        `;
        finalScreen.innerHTML = "❤️";
        document.body.appendChild(finalScreen);
        setTimeout(() => {
            window.close();
            
            // Если window.close() не сработал, выводим инструкцию по "выходу"
            const hint = document.createElement('div');
            hint.style.cssText = "color: #333; font-size: 12px; margin-top: 20px;";
            hint.innerHTML = "[ You can now safely close this terminal ]";
            finalScreen.appendChild(hint);
        }, 2000);
    }, 3000);
}

// Чтобы клик по экрану возвращал фокус в инпут
document.addEventListener("click", () => commandInput.focus());
</script>

</body>
</html>
